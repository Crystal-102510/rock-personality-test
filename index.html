<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7de" />
    <meta
      name="description"
      content="岩点人格：15 道生活题，测出别人和你相处时究竟是什么手感。"
    />
    <title>岩点人格｜测测你是哪种岩点型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>

    <header class="topbar" id="topbar">
      <button class="icon-button" id="backButton" type="button" aria-label="返回上一题" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <button class="brand-button" id="homeButton" type="button" aria-label="返回岩点人格首页">
        <span class="brand-dot" aria-hidden="true"></span>
        岩点人格
      </button>
      <button class="text-button" id="restartTopButton" type="button" hidden>重新测试</button>
    </header>

    <main id="app" tabindex="-1"></main>

    <div class="save-overlay" id="saveOverlay" role="dialog" aria-modal="true" aria-labelledby="saveTitle" hidden>
      <button class="overlay-close" id="closeSaveOverlay" type="button" aria-label="关闭结果卡预览">×</button>
      <div class="save-panel">
        <p class="eyebrow" id="saveTitle">你的结果卡已生成</p>
        <img id="shareImage" alt="岩点人格结果卡" />
        <p class="save-tip">手机请长按图片保存，电脑可右键保存。</p>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./data.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
